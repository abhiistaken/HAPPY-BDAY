<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gossip Girl - Gallery</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;

    background: #b95b87;

    font-family: Arial, sans-serif;

    color: white;

    padding: 25px 15px 40px;
}


/* =========================
   TITLE
========================= */

.gallery-title {
    text-align: center;

    color: #f4f6c5;

    font-size: 42px;

    font-weight: 300;

    letter-spacing: -2px;

    margin-bottom: 25px;
}


/* =========================
   GALLERY
========================= */

.gallery {
    width: 100%;
    max-width: 500px;

    margin: 0 auto;

    display: grid;

    grid-template-columns: repeat(2, 1fr);

    grid-template-rows: repeat(4, 1fr);

    gap: 12px;
}


/* =========================
   PICTURE DIVISIONS
========================= */

.gallery-box {
    width: 100%;

    aspect-ratio: 1 / 1;

    background: rgba(255,255,255,0.08);

    border: 1px solid rgba(23, 23, 20, 0.5);

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;
}

.gallery-box img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}


/* =========================
   PARAGRAPH
========================= */

.gallery-text {
    width: 100%;
    max-width: 500px;

    margin: 25px auto 0;

    padding: 18px 20px;

    text-align: center;

    color: #5c3045;

    background: #f6c1d8;

    border-radius: 12px;

    font-size: 13px;
    line-height: 1.5;

    box-shadow: 0 4px 15px rgba(255, 170, 200, 0.25);
}


/* =========================
   BACK
========================= */

.back {
    display: block;

    width: fit-content;

    margin: 25px auto 0;

    color: #74d9ff;

    font-size: 12px;

    text-decoration: underline;
}

</style>

</head>
